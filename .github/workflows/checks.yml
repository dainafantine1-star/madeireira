name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: PLAYWRIGHT_BROWSERS_PATH="$PWD/.cache/playwright" npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browsers
      - run: npm run check:performance
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: playwright-report/
      - run: docker build -t madeireira-test .
